openapi: 3.1.0
info:
  title: "NEAR Protocol RPC: View global contract code"
  description: Look up a global contract's WebAssembly bytes by its Base58-encoded SHA-256 code hash.
  version: 1.0.0
servers:
  - url: https://rpc.mainnet.fastnear.com
    description: Mainnet
  - url: https://rpc.testnet.fastnear.com
    description: Testnet
  - url: https://archival-rpc.mainnet.fastnear.com
    description: Mainnet Archival
  - url: https://archival-rpc.testnet.fastnear.com
    description: Testnet Archival
paths:
  /:
    post:
      operationId: view_global_contract_code
      summary: View global contract code
      description: Look up a global contract's WebAssembly bytes by its Base58-encoded SHA-256 code hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - id
                - method
                - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                    - "2.0"
                id:
                  type: string
                  example: fastnear
                method:
                  type: string
                  enum:
                    - query
                params:
                  type: object
                  properties:
                    code_hash:
                      type: string
                      description: Base58-encoded hash
                    request_type:
                      type: string
                      enum:
                        - view_global_contract_code
                    finality:
                      type: string
                      enum:
                        - final
                        - near-final
                        - optimistic
                      description: Block finality
                  required:
                    - request_type
                    - code_hash
                    - finality
            examples:
              mainnet:
                summary: View global contract code (Mainnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: query
                  params:
                    code_hash: A2VxywASqbnarBAfTWobhDZjMXobjnYyJmkjhoXAiYBz
                    request_type: view_global_contract_code
                    finality: final
              testnet:
                summary: View global contract code (Testnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: query
                  params:
                    code_hash: 3vaopJ7aRoivvzZLngPQRBEd8VJr2zPLTxQfnRCoFgNX
                    request_type: view_global_contract_code
                    finality: final
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "403":
          description: The supplied API key was not recognized.
          content:
            text/plain:
              schema:
                type: string
              example: Invalid API key
security:
  - {}
  - BearerAuth: []
  - ApiKeyAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "FastNEAR API key as an `Authorization: Bearer` header. Preferred for backends, workers, and proxies because it keeps the key out of URLs and logs."
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
      description: FastNEAR API key as the `apiKey` query parameter. Handy for curl or clients that cannot set headers, but the key can end up in URLs, logs, and shell history.
  schemas:
    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
          description: A view of the contract code.
          properties:
            code_base64:
              type: string
            hash:
              type: string
              description: Base58-encoded hash
          required:
            - code_base64
            - hash
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
