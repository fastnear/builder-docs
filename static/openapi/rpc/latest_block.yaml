openapi: 3.1.0
info:
  title: "NEAR Protocol RPC: Latest Block"
  description: Fetch the latest final block — finality set automatically, no block ID needed.
  version: 1.0.0
servers:
  - url: https://rpc.mainnet.fastnear.com
    description: Mainnet RPC
  - url: https://rpc.testnet.fastnear.com
    description: Testnet RPC
  - url: https://archival-rpc.mainnet.fastnear.com
    description: Mainnet Archival RPC
  - url: https://archival-rpc.testnet.fastnear.com
    description: Testnet Archival RPC
security:
  - {}
  - BearerAuth: []
  - ApiKeyAuth: []
paths:
  /:
    post:
      operationId: latest_block
      summary: Get latest block
      description: Fetch the latest final block — finality set automatically, no block ID needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - id
                - method
                - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                    - "2.0"
                id:
                  type: string
                  example: fastnear
                method:
                  type: string
                  enum:
                    - block
                params:
                  type: object
                  required:
                    - finality
                  properties:
                    finality:
                      type: string
                      enum:
                        - final
                        - near-final
                        - optimistic
                      description: Finality selector for the latest visible block
            examples:
              mainnet:
                summary: Mainnet Latest Block
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: block
                  params:
                    finality: optimistic
              testnet:
                summary: Testnet Latest Block
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: block
                  params:
                    finality: optimistic
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "403":
          description: The supplied API key was not recognized.
          content:
            text/plain:
              schema:
                type: string
              example: Invalid API key
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "FastNEAR API key as an `Authorization: Bearer` header. Preferred for backends, workers, and proxies because it keeps the key out of URLs and logs."
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
      description: FastNEAR API key as the `apiKey` query parameter. Handy for curl or clients that cannot set headers, but the key can end up in URLs, logs, and shell history.
  schemas:
    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
