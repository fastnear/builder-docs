                summary: Get current validators (Testnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: validators
                  params:
                    - null
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse_validators_current"
        "403":
          description: The supplied API key was not recognized.
          content:
            text/plain:
              schema:
                type: string
              example: Invalid API key
  /validators_by_epoch:
    post:
      operationId: validators_by_epoch
      summary: Get validators by epoch
      description: Fetch the validator set for a chosen past epoch, selected by epoch-start block height or Base58 epoch-id hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - id
                - method
                - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                    - "2.0"
                id:
                  type: string
                  example: fastnear
                method:
                  type: string
                  enum:
                    - validators
                params:
                  type: object
                  required:
                    - epoch_id
                  properties:
                    epoch_id:
                      type: string
                      description: Base58-encoded epoch identifier hash
            examples:
              mainnet:
                summary: Get validators by epoch (Mainnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: validators
                  params:
                    epoch_id: 4cPDvNDzf3zbKvAxPNWnNGGz8x2tty6xhowmsugAm3fo
              testnet:
                summary: Get validators by epoch (Testnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: validators
                  params:
                    epoch_id: BARiarhzfSL7G737ik4AukX9sFYH1iR3dYU3KNUAvF3e
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse_validators_by_epoch"
        "403":
          description: The supplied API key was not recognized.
          content:
            text/plain:
              schema:
                type: string
              example: Invalid API key
  /EXPERIMENTAL_validators_ordered:
    post:
      operationId: EXPERIMENTAL_validators_ordered
      summary: Get validators ordered
      description: List validators ordered by stake size at a chosen block — broader than just the current active set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - id
                - method
                - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                    - "2.0"
                id:
                  type: string
                  example: fastnear
                method:
                  type: string
                  enum:
                    - EXPERIMENTAL_validators_ordered
                params:
                  type: object
                  properties:
                    block_id:
                      oneOf:
                        - type: integer
                          description: Block height
                        - type: string
                          description: Base58-encoded block hash
                        - type: "null"
                      description: Block height (integer) or block hash (string)
            examples:
              mainnet:
                summary: Get validators ordered (Mainnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: EXPERIMENTAL_validators_ordered
                  params:
                    block_id: 194263739
              testnet:
                summary: Get validators ordered (Testnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: EXPERIMENTAL_validators_ordered
                  params:
                    block_id: 246016197
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse_EXPERIMENTAL_validators_ordered"
        "403":
          description: The supplied API key was not recognized.
          content:
            text/plain:
              schema:
                type: string
              example: Invalid API key
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "FastNEAR API key as an `Authorization: Bearer` header. Preferred for backends, workers, and proxies because it keeps the key out of URLs and logs."
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
      description: FastNEAR API key as the `apiKey` query parameter. Handy for curl or clients that cannot set headers, but the key can end up in URLs, logs, and shell history.
  schemas:
    JsonRpcResponse_view_account:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
          description: A view of the account
          properties:
            amount:
              type: string
              description: Amount in yoctoNEAR
            code_hash:
              type: string
              description: Base58-encoded hash
            global_contract_account_id:
              type:
                - string
                - "null"
              description: NEAR account ID
            global_contract_hash:
              type:
                - string
                - "null"
              description: Base58-encoded hash
            locked:
              type: string
              description: Amount in yoctoNEAR
            storage_paid_at:
              type: integer
              description: "TODO(2271): deprecated."
              format: uint64
              default: 0
              minimum: 0
            storage_usage:
              type: integer
              format: uint64
              minimum: 0
          required:
            - amount
            - locked
            - code_hash
            - storage_usage
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
    JsonRpcResponse_view_access_key:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
          description: Describes access key permission scope and nonce.
          properties:
            nonce:
              type: integer
              format: uint64
              minimum: 0
            permission:
              type: object
              description: One of multiple possible types
          required:
            - nonce
            - permission
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
    JsonRpcResponse_view_access_key_list:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
          description: Lists access keys
          properties:
            keys:
              type: array
              items:
                type: object
                description: |-
                  Describes information about an access key including its on-trie
                  identifier. For ed25519/secp256k1 access keys the `public_key` field
                  is the full public key (string form unchanged from before); for
                  ML-DSA-65 access keys it is a `ml-dsa-65-hash:...` SHA3-256 digest
                  (the full pubkey is not stored on-chain).
          required:
            - keys
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
