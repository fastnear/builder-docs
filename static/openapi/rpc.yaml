                params:
                  type: object
                  properties:
                    block_height:
                      type:
                        - integer
                        - "null"
                      description: "Optional hint: block height near where the receipt was created, to bound the fallback scan."
                      format: uint64
                      minimum: 0
                    receipt_id:
                      type: string
                      description: Base58-encoded receipt ID to resolve to its originating transaction.
                    shard_id:
                      type:
